<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spagbol interpreter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Spagbol</h1>
    <p>An esoteric programming language created by Liam Latz. Read about it and see example programs on <a href="https://github.com/Round747/spagbol-interpreter" target="_blank">Github.</a></p>
    <div>
    
        <div class="button" id="text-box-editor">Text box</div><div class="button" id="grid-editor">Editor</div><div class="vr"></div> Cell grid: <input type="checkbox" id="cell-grid" checked><div class="vr"></div> <div class="button" onclick="prompt('press Ctrl+c to copy:\n\n' + localStorage.getItem('input-box-backup'), localStorage.getItem('input-box-backup'))">Load backup</div> <span style="color: gray; font-size: 0.75rem;">(Created every 3 minutes)</span>
    </div>
    <div id="code-container">
        <div id="cell-grid-overlay"></div>
        <canvas id="editor-canvas"></canvas>
        <canvas id="visualise"></canvas>
<textarea name="" id="input-text-area" cols="80" rows="20">
                   /----------------------------------------------------------\
                   |                             /-------------------(-)-x    |
                   |                         /---<                            |
                   |             x x         |   \---{0}----\                 |
                   |   /--{""}--{|+|}--{-=""}<      /-------\    /-------\    /---\
                   |   |         | |         \--{1}-/    /-{|=1}-<       |    | x |
        /----------/   |         | \-----------------\   |  x    \--(-)--\-{-=|}< |
*--{$}--<              \-v-------+-------------------+---/                    | @ |
        \---:---\        |       \-----------\       \----------\             \---/
                |    x   |                   |       /---{""}---/           
          /-----\    |   |                /--+--{-=0}<          |           
*--{1}-/--+--{-<|}---<   \-v----/--{->0}--<  |       \-{"Buzz"}-/           
       |  \-----/    |     |    |         |  |
       |             |     |    \--{--5}--/  \---------------\
       \------:------^-----<                      /---{""}---/
                           |              /--{-=0}<          |
                           \----/--{->0}--<       \-{"Fizz"}-/
                                |         |      
                                \--{--3}--/
</textarea>
    </div>

    <br>
    <div class="button" id="step-program">Step</div><div class="button" id="start-program">Start</div><div class="button" id="stop-program">Stop</div><div class="button" id="restart-program">Restart</div>
    <div class="vr"></div>
    Tick rate: <input type="number" id="tick" value="50" style="width: 4rem;"> /s
    <div class="vr"></div>
        
    cycles: <span id="cycles">0</span>
    <div class="vr"></div>
    <br>
    <div class="button" id="calculate-program">Instant</div>
    <span style="margin-left: 0.25rem;">colourful workers:</span>
    <input type="checkbox" name="" id="colourful-workers" checked>
    <div>
        <h2 style="display: inline-block;">Output</h2> <div class="vr"></div> Additive: <input type="checkbox" name="" id="additive">
    </div>
    <hr>
    <table id="output"></table>

</body>

<script src="bundle.js"></script>
</html>
